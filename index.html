<!-- list of the .jpg/.jpeg files in pics/slideshow1 ... pics/slideshow9;

<script type="text/javascript" src="pics/slideshows.js"></script>

<script type="text/javascript">
// One entry per grid cell.  The photos themselves are not listed here: each
// cell is filled with every image that scripts/make-slideshows.sh found in the
// matching pics/slideshowN/ folder.
var SLIDESHOW_FX = {
    slideshow1: { fx: 'scrollRight', random: 0, speed: 300,  timeout: 2000, pause: 1 },
    slideshow2: { fx: 'scrollDown',  random: 0, speed: 600,  timeout: 1380, pause: 1 },
    slideshow3: { fx: 'scrollLeft',  random: 0, speed: 700,  timeout: 1650, pause: 1 },
    slideshow4: { fx: 'scrollRight', random: 0, speed: 600,  timeout: 2050, pause: 1 },
    slideshow5: { fx: 'fade',        random: 1, speed: 600,  timeout: 1750, pause: 1 },
    slideshow6: { fx: 'scrollDown',  random: 0, speed: 300,  timeout: 2100, pause: 1 },
    slideshow7: { fx: 'scrollUp',    random: 0, speed: 300,  timeout: 1940, pause: 1 },
    slideshow8: { fx: 'scrollLeft',  random: 0, speed: 500,  timeout: 1500, pause: 1 },
    slideshow9: { fx: 'scrollUp',    random: 0, speed: 1000, timeout: 2250, pause: 1 }
};

$(document).ready(function() {
    $.each(SLIDESHOW_FX, function(name, opts) {
        var files = (window.SLIDESHOWS && SLIDESHOWS[name]) || [];
        var $cell = $('.' + name);
        $.each(files, function(i, file) {
            $('<img>').attr({ src: 'pics/' + name + '/' + file,
                              width: 138, height: 179 }).appendTo($cell);
        });
        // Cycle needs at least two frames; a single photo just sits there.
        if (files.length > 1) { $cell.cycle(opts); }
    });
});
</script>
