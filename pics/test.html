<!DOCTYPE html>
<html>
<head>
<title>JQuery Cycle Plugin - Basic Demo</title>
<style type="text/css">
.slideshow { height: 240px; width: 185px; margin: auto }
.slideshow img { padding: 0px; border: 0px solid #fff; background-color: #fff; }
</style>

<!-- include jQuery library -->

<script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.5/jquery.min.js"></script>

<!-- include Cycle plugin -->

<script type="text/javascript" src="http://malsup.github.com/jquery.cycle.all.js"></script>

<script type="text/javascript">
$(document).ready(function() {
    $('.slideshow5').cycle({
		fx: 'fade', random: 1, speed: 600, timeout: 1750, pause: 1
	});
});
</script>

<script type="text/javascript">
$(document).ready(function() {
    $('.slideshow2').cycle({
                fx: 'scrollLeft', random: 1, speed: 500, timeout: 1500, pause: 1
        });
});
</script>
